services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreui_laravel_app
    ports:
      - "8000:80"
    environment:
      - APP_NAME="CoreUI Laravel"
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=coreui_db
      - DB_USERNAME=coreui_user
      - DB_PASSWORD=coreui_secret
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    volumes:
      - .:/app
      - /app/node_modules
      - /app/vendor
      - /app/public/build
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  laravel-network:
    driver: bridge
